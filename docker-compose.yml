services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mapsafe
      POSTGRES_PASSWORD: mapsafe_local_only
      POSTGRES_DB: mapsafe
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - mapsafe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mapsafe -d mapsafe']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mapsafe-postgres:
