name: MVP checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mapsafe
          POSTGRES_PASSWORD: mapsafe_ci_only
          POSTGRES_DB: mapsafe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mapsafe -d mapsafe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mapsafe:mapsafe_ci_only@127.0.0.1:5432/mapsafe_test
      TEST_DATABASE_URL: postgresql://mapsafe:mapsafe_ci_only@127.0.0.1:5432/mapsafe_test
      E2E_DATABASE_URL: postgresql://mapsafe:mapsafe_ci_only@127.0.0.1:5432/mapsafe_test?schema=e2e
      GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            backend/coverage/
            frontend/coverage/
            playwright-report/
          retention-days: 14
